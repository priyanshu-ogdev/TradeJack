[project]
name = "tradejack"
version = "3.0.0"
description = "Autonomous self-RL trading system with live market deployment"
requires-python = ">=3.11"
license = {text = "Proprietary"}

dependencies = [
    # Core ML
    "torch>=2.2",
    "numpy>=1.26",
    "stable-baselines3>=2.3",
    "gymnasium>=1.0",
    "sb3-contrib>=2.3",

    # Data pipeline
    "polars>=1.0",
    "pyarrow>=15.0",
    "pydantic-settings>=2.0",
    "aiohttp>=3.9",

    # Exchange connectivity
    "ccxt>=4.0",
    "websockets>=12.0",

    # Dashboard
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dgx = [
    "cudf-cu12",
    "kvikio",
    "nvidia-dali-cuda120",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
