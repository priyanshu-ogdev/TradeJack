[project]
name = "tradejack"
version = "3.7.0"
description = "Autonomous self-RL trading system: continuous PPO/SAC/DQN training, paper and real Binance spot execution, and a telemetry dashboard."
requires-python = ">=3.11"
license = {text = "Proprietary"}

# Kept in sync with requirements.txt's CORE section -- that file is the
# actively-maintained, import-verified source of truth (every entry checked
# against a real grep of actual `import` statements across the repo, not
# assumed). This list mirrors it rather than duplicating an independent,
# divergent one. If you change one, change both.
#
# BUG FIXED HERE: this previously listed fastapi + uvicorn for the
# dashboard -- but dashboard/telemetry_server.py is, and always was, a Flask
# app. Whatever dashboard stack this file described was never what got
# built. Corrected to flask, matching reality.
dependencies = [
    # RL training engine
    "torch>=2.2",
    "stable-baselines3>=2.2",
    "gymnasium>=0.29",

    # Core numerics
    "numpy>=1.26,<2.0",
    "pandas>=2.1",
    "scikit-learn>=1.3",
    "scipy>=1.11",

    # Data & storage
    "polars>=0.20",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "qdrant-client>=1.7",

    # Networking & live execution
    "aiohttp>=3.9",
    "requests>=2.31",
    "ccxt>=4.2",
    "python-dotenv>=1.0",

    # Dashboard (dashboard/telemetry_server.py is a Flask app)
    "flask>=3.0",

    # Misc
    "huggingface-hub>=0.20",
]

[project.optional-dependencies]
# DGX-tier acceleration. NOT reliably plain-pip-installable in general --
# RAPIDS packages typically need conda or NVIDIA's own package index. Every
# import site for these already degrades gracefully via try/except (see
# data_forge/kvikio_streamer.py, feature_engineering.py, dali_loader.py) --
# nothing in this project requires this extra to run.
dgx = [
    "cudf-cu12",
    "nvidia-dali-cuda120",
    "chromadb>=0.4",
    "pandera[polars]>=0.18",
    "tensorboard>=2.15",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
# BUG FIXED HERE: this previously pointed at
# "setuptools.backends._legacy:_Backend", which does not exist --
# `import setuptools.backends` raises ModuleNotFoundError (confirmed by
# actually importing it). Any `pip install -e .` or `python -m build` would
# have failed immediately. Corrected to the real, standard setuptools entry
# point.
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
